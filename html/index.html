<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>FRZ RP</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Title card displayed at the beginning of the cinematic -->
    <div id="title-card" class="hidden">
        <div class="title-card-logo">FRZ</div>
        <div class="title-card-main" id="title-card-main">FRZ RP</div>
        <div class="title-card-sub" id="title-card-sub">Los Santos International Airport</div>
        <div class="title-card-line"></div>
    </div>

    <!-- Main welcome banner (bottom) shown after the cinematic -->
    <div id="banner" class="hidden">
        <div class="logo">FRZ</div>
        <div class="title" id="banner-title">Bienvenue sur FRZ RP</div>
        <div class="subtitle" id="banner-subtitle">Vous etes bien arrive a destination</div>
    </div>

    <!-- Car rental menu (shown when player interacts with dealer NPC) -->
    <div id="rental" class="hidden">
        <div class="rental-header">
            <div class="rental-brand">FRZ</div>
            <div class="rental-title">Concession FRZ</div>
            <div class="rental-subtitle">Location de vehicules</div>
            <button class="rental-close" id="rental-close" type="button" aria-label="Fermer">&times;</button>
        </div>

        <div class="rental-balance-row">
            <div class="rental-balance-label">Solde</div>
            <div class="rental-balance-value"><span id="rental-balance">0</span> <span class="rental-currency">$</span></div>
        </div>

        <div class="rental-tabs" id="rental-tabs"></div>

        <div class="rental-list" id="rental-list"></div>
        <div class="rental-error hidden" id="rental-error"></div>
        <div class="rental-hint">
            <strong>ESC</strong> pour fermer, clique sur un vehicule pour le prendre.
        </div>
    </div>

    <audio id="welcome-audio" src="welcome_fr.ogg" preload="auto"></audio>
    <audio id="plane-audio" src="plane_landing.ogg" preload="auto"></audio>
    <script src="app.js"></script>
</body>
</html>
